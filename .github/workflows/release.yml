name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag is not a SemVer release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        run: ./Scripts/package-release.sh --version "${{ steps.version.outputs.version }}" --output-dir dist

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: nook-release-assets
          if-no-files-found: error
          path: |
            dist/Nook-*.dmg
            dist/Nook-*.zip
            dist/Nook-*.sha256

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          name: nook-release-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nook $VERSION" \
            --generate-notes \
            dist/Nook-*.dmg \
            dist/Nook-*.zip \
            dist/Nook-*.sha256
